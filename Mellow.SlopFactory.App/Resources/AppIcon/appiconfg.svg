<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- A factory whose chimney pours out slop. Kept inside the middle of the canvas so round and squircle masks don't clip it. -->
    <defs>
        <linearGradient id="slop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff4f9a" />
            <stop offset="1" stop-color="#ffb03b" />
        </linearGradient>
    </defs>
    <g transform="translate(228 228) scale(0.86) translate(-238 -222)">
        <!-- Building: sawtooth roof on the left, chimney on the right. -->
        <path d="M128 330 V215 L178 240 V215 L228 240 V250 H274 V160 H314 V330 Z"
              fill="#f4f1ff" stroke="#f4f1ff" stroke-width="10" stroke-linejoin="round" />
        <!-- Windows. -->
        <rect x="146" y="268" width="24" height="30" rx="4" fill="#2b1660" />
        <rect x="190" y="268" width="24" height="30" rx="4" fill="#2b1660" />
        <rect x="234" y="268" width="24" height="30" rx="4" fill="#2b1660" />
        <!-- Slop billowing out of the chimney and dripping down it. -->
        <g fill="url(#slop)">
            <circle cx="274" cy="138" r="25" />
            <circle cx="304" cy="114" r="33" />
            <circle cx="336" cy="140" r="23" />
            <rect x="262" y="136" width="84" height="26" rx="10" />
            <path d="M280 150 V198 a8 8 0 0 0 16 0 V150 Z" />
            <path d="M300 150 V180 a6 6 0 0 0 12 0 V150 Z" />
            <!-- One stream runs down the chimney's side into a puddle at its foot. -->
            <path d="M314 150 H330 V326 H314 Z" />
            <ellipse cx="324" cy="334" rx="42" ry="10" />
        </g>
    </g>
</svg>
